<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expense Tracking</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --primary: #0F766E;
  --primary-dark: #115E59;
  --primary-soft: #CCFBF1;
  --accent: #F59E0B;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #0F172A;
  --text-light: #64748B;
  --border: #E2E8F0;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --radius: 12px;
  --radius-sm: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 80px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
}

.topbar h1 {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
}

.topbar .sub {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 400;
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  font-size: 20px;
}

.icon-btn:hover { background: var(--bg); }

.content { padding: 16px; }

.bottomnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin: 0 auto;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 4px env(safe-area-inset-bottom, 8px);
  z-index: 50;
}

.bottomnav button {
  flex: 1;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--text-light);
  font-size: 11px;
  font-weight: 500;
  border-radius: 8px;
}

.bottomnav button.active { color: var(--primary); }
.bottomnav button .ico { font-size: 20px; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

.card-tight { padding: 12px; }

h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}

h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 16px 4px 8px;
}

.muted { color: var(--text-light); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }

.btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s;
  text-decoration: none;
}

.btn:hover { background: var(--primary-dark); }
.btn:active { transform: scale(0.99); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover { background: var(--bg); }

.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #DC2626; }

.btn-ghost {
  background: none;
  color: var(--primary);
  border: none;
  padding: 6px 8px;
  width: auto;
}

.btn-row {
  display: flex;
  gap: 8px;
}

.btn-row .btn { flex: 1; }

.btn-sm {
  padding: 6px 12px;
  font-size: 13px;
  width: auto;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text);
}

input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  background: var(--card);
  color: var(--text);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
}

textarea {
  resize: vertical;
  min-height: 60px;
}

.field { margin-bottom: 14px; }

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.row3 {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  padding: 10px 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #34D399, #0F766E);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
  font-size: 14px;
}

.user-pill .info {
  flex: 1;
  min-width: 0;
}

.user-pill .info .e {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-pill .info .m {
  font-size: 11px;
  color: var(--text-light);
}

.trip-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
}

.trip-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.trip-card.selected { border-color: var(--primary); }

.trip-card .name {
  font-weight: 600;
  font-size: 16px;
}

.trip-card .meta {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 2px;
}

.trip-card .row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 10px;
}

.trip-card .stat { text-align: right; }

.trip-card .stat .v {
  font-weight: 600;
  font-size: 14px;
}

.trip-card .stat .l {
  font-size: 11px;
  color: var(--text-light);
}

.sheet-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-light);
  text-decoration: none;
  margin-top: 6px;
}

.sheet-link:hover { color: var(--primary); }

.status-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  margin-top: 4px;
}

.status-active {
  background: #D1FAE5;
  color: #065F46;
}

.status-completed {
  background: #DBEAFE;
  color: #1E40AF;
}

.status-archived {
  background: #F3F4F6;
  color: #4B5563;
}

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.kpi {
  background: var(--card);
  padding: 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.kpi .label {
  font-size: 11px;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}

.kpi .value {
  font-size: 22px;
  font-weight: 700;
  margin-top: 4px;
}

.kpi .sub {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

.kpi.full { grid-column: 1 / -1; }

.budget-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.budget-row:last-child { border-bottom: none; }

.budget-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.budget-head .name {
  font-weight: 500;
  font-size: 14px;
}

.budget-head .nums {
  font-size: 13px;
  color: var(--text-light);
}

.budget-head .nums b {
  color: var(--text);
  font-weight: 600;
}

.bar {
  height: 8px;
  background: var(--bg);
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: var(--success);
  border-radius: 999px;
  transition: width 0.3s;
}

.bar-fill.warn { background: var(--warning); }
.bar-fill.over { background: var(--danger); }

.variance {
  font-size: 12px;
  margin-top: 4px;
}

.variance.under { color: var(--success); }
.variance.over { color: var(--danger); }

.list-item {
  background: var(--card);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}

.cat-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.list-item .body {
  flex: 1;
  min-width: 0;
}

.list-item .body .t {
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.list-item .body .s {
  font-size: 12px;
  color: var(--text-light);
}

.list-item .amt {
  text-align: right;
  font-weight: 600;
  font-size: 14px;
  flex-shrink: 0;
}

.list-item .amt .a {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-light);
}

#map {
  height: 60vh;
  min-height: 360px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.leaflet-popup-content {
  font-family: inherit;
  font-size: 13px;
}

.leaflet-popup-content b {
  display: block;
  margin-bottom: 2px;
}

.empty {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-light);
}

.empty .ico {
  font-size: 40px;
  margin-bottom: 8px;
}

.empty .title {
  font-weight: 600;
  color: var(--text);
  font-size: 15px;
  margin-bottom: 4px;
}

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.4);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.sheet {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 16px 16px 24px;
  animation: slideUp 0.2s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.boot-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  max-width: 480px;
  margin: 0 auto;
  text-align: center;
}

.boot-logo {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #34D399, #0F766E);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: var(--shadow-md);
}

.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: white;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  box-shadow: var(--shadow-md);
  animation: fadeIn 0.2s;
  max-width: 90%;
  text-align: center;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.tabs {
  display: flex;
  gap: 4px;
  background: var(--card);
  padding: 4px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}

.tabs button {
  flex: 1;
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-light);
  border-radius: 6px;
}

.tabs button.active {
  background: var(--primary);
  color: white;
}

.cat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  box-shadow: var(--shadow-sm);
}

.cat-item.inactive { opacity: 0.55; }

.cat-item .name {
  flex: 1;
  font-weight: 500;
}

.cat-item .actions {
  display: flex;
  gap: 4px;
}

.curr-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  height: 32px;
}

.curr-btn:hover { background: var(--primary-soft); }

.curr-btn .curr-code {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}

.curr-status {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-live {
  background: var(--success);
  box-shadow: 0 0 0 2px rgba(16,185,129,0.2);
}

.status-cached { background: var(--warning); }
.status-fallback { background: var(--text-light); }
.status-manual { background: var(--primary); }

.curr-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.curr-tile {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: all 0.15s;
}

.curr-tile:hover { border-color: var(--primary); }

.curr-tile.active {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.curr-tile .c {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.curr-tile .r {
  font-size: 11px;
  color: var(--text-light);
  font-variant-numeric: tabular-nums;
}

.curr-tile.active .r { color: var(--primary-dark); }

.rates-status {
  background: var(--bg);
  padding: 12px;
  border-radius: var(--radius-sm);
}

.banner {
  background: #FEF3C7;
  color: #92400E;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  margin-bottom: 12px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

.banner.info {
  background: #DBEAFE;
  color: #1E40AF;
}

.banner.success {
  background: #D1FAE5;
  color: #065F46;
}
</style>
</head>

<body>

<div id="root">
  <div class="boot-screen">
    <div class="boot-logo">💼</div>
    <h2>Expense Tracking</h2>
    <div class="spinner"></div>
    <div class="muted small">Loading your data from Google Drive…</div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
const RATES_CACHE_KEY = 'exptrack_rates_cache_v1';
const DISPLAY_CURR_KEY = 'exptrack_display_currency_v1';
const SELECTED_TRIP_KEY = 'exptrack_selected_trip_v1';

const SUPPORTED_CURRENCIES = [
  'EUR',
  'USD',
  'GBP',
  'AED',
  'INR',
  'NOK',
  'CHF',
  'JPY',
  'CAD',
  'AUD',
  'SGD',
  'THB'
];

const FALLBACK_RATES = {
  EUR: 1,
  USD: 1.08,
  GBP: 0.85,
  AED: 3.95,
  INR: 90.5,
  NOK: 11.5,
  CHF: 0.95,
  JPY: 165,
  CAD: 1.48,
  AUD: 1.65,
  SGD: 1.45,
  THB: 38.5
};

const state = {
  ready: false,
  userEmail: '',
  settingsSpreadsheetUrl: '',
  trips: [],
  categories: [],
  expensesByTrip: {},
  predictionsByTrip: {},
  rates: { ...FALLBACK_RATES },
  ratesUpdated: new Date().toISOString(),
  ratesSource: 'Fallback defaults',
  ratesStatus: 'fallback',
  displayCurrency: localStorage.getItem(DISPLAY_CURR_KEY) || 'EUR',
  selectedTripId: localStorage.getItem(SELECTED_TRIP_KEY) || null,
  editingTripId: null,
  screen: 'home',
  dashTab: 'overview',
  loading: false
};

/* ----------------------------- HELPERS ---------------------------------- */

const fmtDate = d => {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, {
    month: 'short',
    day: 'numeric'
  });
};

const fmtFullDate = d => {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
};

const fmtMoney = (n, c = 'EUR') => {
  const symbols = {
    EUR: '€',
    AED: 'د.إ ',
    INR: '₹',
    USD: '$',
    GBP: '£',
    NOK: 'kr ',
    CHF: 'CHF ',
    JPY: '¥',
    CAD: 'C$',
    AUD: 'A$',
    SGD: 'S$',
    THB: '฿'
  };

  const v = (Number(n) || 0).toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  return (symbols[c] || c + ' ') + v;
};

const escapeHtml = s => String(s || '').replace(/[&<>"']/g, m => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[m]));

function convert(amountEur, toCurrency) {
  return (Number(amountEur) || 0) * (state.rates[toCurrency] || 1);
}

function fmtDisplay(amountEur) {
  return fmtMoney(convert(amountEur, state.displayCurrency), state.displayCurrency);
}

function tripById(id) {
  return state.trips.find(t => t.id === id);
}

function catById(id) {
  return state.categories.find(c => c.id === id);
}

function expensesForTrip(id) {
  return state.expensesByTrip[id] || [];
}

function predictionsForTrip(id) {
  return state.predictionsByTrip[id] || [];
}

function setSelectedTripId(tripId) {
  state.selectedTripId = tripId;

  try {
    if (tripId) {
      localStorage.setItem(SELECTED_TRIP_KEY, tripId);
    } else {
      localStorage.removeItem(SELECTED_TRIP_KEY);
    }
  } catch {}
}

function formatRateAge(value) {
  const time = new Date(value).getTime();

  if (!value || Number.isNaN(time)) {
    return 'unknown';
  }

  const ageMins = Math.max(0, Math.round((Date.now() - time) / 60000));

  if (ageMins < 60) {
    return `${ageMins} min ago`;
  }

  if (ageMins < 1440) {
    return `${Math.round(ageMins / 60)}h ago`;
  }

  return `${Math.round(ageMins / 1440)}d ago`;
}

function toast(msg) {
  const root = document.getElementById('toast-root');

  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;

  clearTimeout(toast._t);

  toast._t = setTimeout(() => {
    root.innerHTML = '';
  }, 2400);
}

function showBootError(message) {
  document.getElementById('root').innerHTML = `
    <div class="boot-screen">
      <div class="boot-logo">⚠️</div>
      <h2>Couldn't load</h2>
      <div class="muted small" style="text-align:center; max-width:360px">
        ${escapeHtml(message)}
      </div>
      <div class="banner" style="text-align:left; max-width:360px">
        <div>
          <b>Try this:</b><br>
          1. Open Apps Script.<br>
          2. Run <b>debugBootstrap</b> manually.<br>
          3. Authorize permissions.<br>
          4. Redeploy as a new version.
        </div>
      </div>
      <button class="btn" onclick="location.reload()">Retry</button>
    </div>
  `;
}

/* ----------------------- google.script.run wrapper ---------------------- */

function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    let finished = false;

    const timer = setTimeout(() => {
      if (finished) return;

      finished = true;

      reject(new Error(
        `Loading timed out while running "${fnName}". Please check Apps Script authorization and deployment settings.`
      ));
    }, 30000);

    try {
      google.script.run
        .withSuccessHandler(result => {
          if (finished) return;

          finished = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(err => {
          if (finished) return;

          finished = true;
          clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : String(err)));
        })[fnName](...args);
    } catch (err) {
      if (finished) return;

      finished = true;
      clearTimeout(timer);
      reject(err);
    }
  });
}

/* ----------------------- RATES ------------------------------------------ */

async function loadRates() {
  const cached = readRatesCache();

  if (cached) {
    state.rates = { ...FALLBACK_RATES, ...cached.rates };
    state.ratesUpdated = cached.fetchedAt;
    state.ratesSource = cached.source;
    state.ratesStatus = cached.source === 'Manual' ? 'manual' : 'cached';
  }

  try {
    const stored = await gsRun('getStoredRates');

    if (stored && stored.rates && Object.keys(stored.rates).length > 1) {
      state.rates = { ...FALLBACK_RATES, ...stored.rates };
      state.ratesUpdated = stored.updated || new Date().toISOString();
      state.ratesSource = stored.source || 'Stored';
      state.ratesStatus = stored.source === 'Manual' ? 'manual' : 'cached';
    }
  } catch (e) {
    // Keep cache/fallback.
  }

  try {
    const live = await gsRun('fetchAndStoreRates');

    if (live && live.ok) {
      state.rates = { ...FALLBACK_RATES, ...live.rates };
      state.ratesUpdated = live.updated || new Date().toISOString();
      state.ratesSource = live.source || 'Open ER API';
      state.ratesStatus = 'live';

      writeRatesCache({
        rates: state.rates,
        fetchedAt: state.ratesUpdated,
        source: state.ratesSource
      });
    }
  } catch (e) {
    // Keep cache/fallback.
  }
}

function readRatesCache() {
  try {
    return JSON.parse(localStorage.getItem(RATES_CACHE_KEY) || 'null');
  } catch {
    return null;
  }
}

function writeRatesCache(obj) {
  try {
    localStorage.setItem(RATES_CACHE_KEY, JSON.stringify(obj));
  } catch {}
}

function setDisplayCurrency(c) {
  state.displayCurrency = c;

  try {
    localStorage.setItem(DISPLAY_CURR_KEY, c);
  } catch {}

  render();
}

/* ----------------------- INITIAL BOOTSTRAP ------------------------------ */

async function boot() {
  try {
    const data = await gsRun('bootstrap');

    state.userEmail = data.userEmail || 'unknown@user';
    state.settingsSpreadsheetUrl = data.settingsSpreadsheetUrl || '';
    state.trips = data.trips || [];
    state.categories = data.categories || [];

    if (data.rates && data.rates.rates && Object.keys(data.rates.rates).length > 1) {
      state.rates = { ...FALLBACK_RATES, ...data.rates.rates };
      state.ratesUpdated = data.rates.updated || new Date().toISOString();
      state.ratesSource = data.rates.source || 'Stored';
      state.ratesStatus = data.rates.source === 'Manual' ? 'manual' : 'cached';
    }

    if (state.trips.length > 0) {
      const savedTripStillExists = state.trips.find(
        t => t.id === state.selectedTripId && t.status !== 'Archived'
      );

      if (!savedTripStillExists) {
        const firstOpenTrip = state.trips.find(t => t.status !== 'Archived');
        setSelectedTripId(firstOpenTrip ? firstOpenTrip.id : null);
      }
    } else {
      setSelectedTripId(null);
    }

    state.ready = true;

    render();

    if (state.selectedTripId) {
      await loadTripData(state.selectedTripId, true);
      render();
    }

    loadRates().then(() => render());
  } catch (e) {
    showBootError(e.message || String(e));
  }
}

async function loadTripData(tripId, force = false) {
  if (!tripId) return;

  if (
    !force &&
    state.expensesByTrip[tripId] !== undefined &&
    state.predictionsByTrip[tripId] !== undefined
  ) {
    return;
  }

  try {
    const [exps, preds] = await Promise.all([
      gsRun('listExpenses', tripId),
      gsRun('listPredictions', tripId)
    ]);

    state.expensesByTrip[tripId] = exps || [];
    state.predictionsByTrip[tripId] = preds || [];
  } catch (e) {
    toast('Failed to load trip data');
  }
}

async function refreshCurrentTripData() {
  if (!state.selectedTripId) {
    toast('Select a trip first');
    return;
  }

  toast('Refreshing data…');

  await loadTripData(state.selectedTripId, true);

  render();

  toast('Data refreshed');
}

function renderActual() {
  const trip = tripById(state.selectedTripId);

  if (!trip) return '';

  const exps = [...expensesForTrip(trip.id)].sort((a, b) =>
    String(b.date + b.time).localeCompare(String(a.date + a.time))
  );

  const totalEur = exps.reduce((s, e) => s + e.amountEur, 0);

  let body;

  if (exps.length === 0) {
    body = `
      <div class="empty">
        <div class="ico">💸</div>
        <div class="title">No expenses yet</div>
        <div>Tap + Add to log your first one.</div>
      </div>
    `;
  } else {
    const groups = {};

    exps.forEach(e => {
      (groups[e.date] = groups[e.date] || []).push(e);
    });

    body = Object.entries(groups).map(([date, items]) => {
      const dayTotal = items.reduce((s, e) => s + e.amountEur, 0);

      return `
        <div class="section-title" style="display:flex; justify-content:space-between; align-items:baseline">
          <span>${fmtFullDate(date)}</span>
          <span style="text-transform:none; color:var(--text); font-size:13px; font-weight:600">
            ${fmtDisplay(dayTotal)}
          </span>
        </div>

        ${items.map(e => renderExpenseRow(e)).join('')}
      `;
    }).join('');
  }

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <div class="small muted">Actual spend</div>
          <div style="font-size:24px; font-weight:700">${fmtDisplay(totalEur)}</div>
          <div class="tiny muted">${exps.length} expense${exps.length === 1 ? '' : 's'}</div>
        </div>

        <button class="btn btn-sm" data-action="add-expense">
          + Add

      </div>

      <a class="sheet-link" href="${trip.spreadsheetUrl}" target="_blank" style="margin-top:8px">
        Sheet tab: Actual ↗
      </a>
    </div>

    ${body}
  `;
}

function renderDashOverview(trip) {
  const exps = expensesForTrip(trip.id);
  const totalEur = exps.reduce((s, e) => s + e.amountEur, 0);

  const preds = predictionsForTrip(trip.id);
  const predTotal = preds.reduce((s, b) => s + b.estimatedEur, 0);

  const variance = predTotal - totalEur;

  const days = Math.max(
    1,
    Math.ceil((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1
  );

  const tracked = new Set(exps.map(e => e.date)).size;

  const byCat = {};

  exps.forEach(e => {
    byCat[e.categoryId] = (byCat[e.categoryId] || 0) + e.amountEur;
  });

  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
  const topCat = top ? catById(top[0]) : null;

  const recent = [...exps]
    .sort((a, b) => String(b.date + b.time).localeCompare(String(a.date + a.time)))
    .slice(0, 5);

  const dc = state.displayCurrency;

  const altCurrencies = ['EUR', 'AED', 'INR'].filter(c => c !== dc).slice(0, 2);
  const altLine = altCurrencies.map(c => fmtMoney(convert(totalEur, c), c)).join(' · ');

  return `
    <div class="kpi-grid">
      <div class="kpi full">
        <div class="label">Actual spent (${dc})</div>
        <div class="value">${fmtDisplay(totalEur)}</div>
        ${altLine ? `<div class="sub">${altLine}</div>` : ''}
      </div>

      ${predTotal > 0 ? `
        <div class="kpi full" style="background:${variance >= 0 ? '#F0FDF4' : '#FEF2F2'}">
          <div class="label">${variance >= 0 ? 'Under prediction' : 'Over prediction'}</div>

          <div class="value" style="color:${variance >= 0 ? 'var(--success)' : 'var(--danger)'}">
            ${variance >= 0 ? '+' : ''}${fmtDisplay(variance)}
          </div>

          <div class="sub">
            Predicted ${fmtDisplay(predTotal)} · Spent ${fmtDisplay(totalEur)}
            (${Math.round((totalEur / predTotal) * 100)}%)
          </div>
        </div>
      ` : `
        <div class="kpi full" style="background:#FFFBEB">
          <div class="label">No prediction set</div>
          <div class="sub" style="margin-top:8px">
            <a href="#" data-action="goto" data-screen="prediction" style="color:var(--primary); font-weight:500">
              Set a prediction →
            </a>
          </div>
        </div>
      `}

      <div class="kpi">
        <div class="label">Days tracked</div>
        <div class="value">
          ${tracked}<span style="font-size:14px; color:var(--text-light); font-weight:500"> / ${days}</span>
        </div>
      </div>

      <div class="kpi">
        <div class="label">Top category</div>
        <div class="value" style="font-size:16px">${topCat ? escapeHtml(topCat.name) : '—'}</div>
        <div class="sub">${top ? fmtDisplay(top[1]) : ''}</div>
      </div>
    </div>

    <div class="section-title">Recent expenses</div>

    ${recent.length === 0 ? `
      <div class="card empty">
        <div class="ico">📝</div>
        <div class="title">No expenses yet</div>
      </div>
    ` : recent.map(e => renderExpenseRow(e)).join('')}

    ${exps.length > 5 ? `
      <button class="btn btn-secondary" data-action="goto" data-screen="actual" style="margin-top:8px">
        View all ${exps.length} on Actual tab
      </button>
    ` : ''}
  `;
}

function renderDashCompare(trip) {
  const exps = expensesForTrip(trip.id);
  const preds = predictionsForTrip(trip.id);

  const spentByCat = {};

  exps.forEach(e => {
    spentByCat[e.categoryId] = (spentByCat[e.categoryId] || 0) + e.amountEur;
  });

  const totalPred = preds.reduce((s, b) => s + b.estimatedEur, 0);
  const totalSpent = exps.reduce((s, e) => s + e.amountEur, 0);
  const overallPct = totalPred ? (totalSpent / totalPred) * 100 : 0;

  if (totalPred === 0) {
    return `
      <div class="empty">
        <div class="ico">🎯</div>
        <div class="title">No prediction set yet</div>
        <div>Set per-category estimates to see how you are tracking.</div>
      </div>

      <button class="btn" data-action="goto" data-screen="prediction">
        Set up prediction
      </button>
    `;
  }

  const catIds = new Set([...preds.map(b => b.categoryId), ...Object.keys(spentByCat)]);

  const rows = [...catIds]
    .map(cid => {
      const c = catById(cid);
      const pred = preds.find(b => b.categoryId === cid);
      const est = pred ? pred.estimatedEur : 0;
      const act = spentByCat[cid] || 0;
      const pct = est ? (act / est) * 100 : (act > 0 ? 999 : 0);

      return { c, est, act, pct };
    })
    .filter(r => r.c)
    .sort((a, b) => b.act - a.act);

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline">
        <h3>Overall</h3>
        <div class="small muted">${Math.round(overallPct)}% of prediction used</div>
      </div>

      <div class="budget-head" style="margin-top:8px">
        <div class="nums">Spent <b>${fmtDisplay(totalSpent)}</b></div>
        <div class="nums">Predicted <b>${fmtDisplay(totalPred)}</b></div>
      </div>

      <div class="bar">
        <div class="bar-fill ${overallPct > 100 ? 'over' : overallPct > 80 ? 'warn' : ''}" style="width:${Math.min(overallPct, 100)}%"></div>
      </div>

      <div class="variance ${totalSpent <= totalPred ? 'under' : 'over'}">
        ${totalSpent <= totalPred
          ? `${fmtDisplay(totalPred - totalSpent)} remaining`
          : `${fmtDisplay(totalSpent - totalPred)} over prediction`
        }
      </div>
    </div>

    <div class="section-title">By category</div>

    <div class="card">
      ${rows.map(r => {
        const cls = r.pct > 100 ? 'over' : r.pct > 80 ? 'warn' : '';
        const noPred = r.est === 0;

        return `
          <div class="budget-row">
            <div class="budget-head">
              <div class="name">${r.c.icon || '📌'} ${escapeHtml(r.c.name)}</div>

              <div class="nums">
                <b>${fmtDisplay(r.act)}</b>
                ${noPred ? '<span style="color:var(--danger)">unplanned</span>' : `/ ${fmtDisplay(r.est)}`}
              </div>
            </div>

            <div class="bar">
              <div class="bar-fill ${cls}" style="width:${Math.min(r.pct, 100)}%"></div>
            </div>

            ${!noPred ? `
              <div class="variance ${r.act <= r.est ? 'under' : 'over'}">
                ${r.act <= r.est
                  ? `${fmtDisplay(r.est - r.act)} left · ${Math.round(r.pct)}% used`
                  : `${fmtDisplay(r.act - r.est)} over · ${Math.round(r.pct)}%`
                }
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn btn-secondary" data-action="goto" data-screen="prediction" style="margin-top:8px">
      Edit prediction
    </button>
  `;
}

let mapInstance = null;

function renderMap() {
  const trip = tripById(state.selectedTripId);

  if (!trip) return '';

  const exps = expensesForTrip(trip.id).filter(e => e.lat && e.lng);

  return `
    <div class="card-tight" style="margin-bottom:8px">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px">
        <div class="small muted">
          ${exps.length} mapped expense${exps.length === 1 ? '' : 's'}
        </div>

        <button class="btn btn-secondary btn-sm" id="export-map">
          📷 Export
        </button>
      </div>
    </div>

    <div id="map"></div>

    ${exps.length === 0 ? `
      <div class="banner" style="margin-top:8px">
        No mapped expenses yet. Capture location when adding expenses to see them here.
      </div>
    ` : ''}
  `;
}

function initMap() {
  const trip = tripById(state.selectedTripId);

  if (!trip) return;

  const exps = expensesForTrip(trip.id).filter(e => e.lat && e.lng);

  exps.sort((a, b) => String(a.date + a.time).localeCompare(String(b.date + b.time)));

  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
  }

  const el = document.getElementById('map');

  if (!el) return;

  const center = exps.length
    ? [Number(exps[0].lat), Number(exps[0].lng)]
    : [48.8, 2.3];

  mapInstance = L.map(el).setView(center, exps.length ? 13 : 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(mapInstance);

  if (exps.length) {
    const points = exps.map(e => [Number(e.lat), Number(e.lng)]);

    exps.forEach(e => {
      const c = catById(e.categoryId);

      L.marker([Number(e.lat), Number(e.lng)])
        .addTo(mapInstance)
        .bindPopup(`
          <b>${escapeHtml(e.description || c?.name || 'Expense')}</b>
          ${fmtDate(e.date)} · ${escapeHtml(c?.name || '')}<br>
          ${fmtDisplay(e.amountEur)}
          <span style="color:#64748B">(${fmtMoney(e.originalAmount, e.originalCurrency)})</span>
          ${e.locationName ? `<br><i>${escapeHtml(e.locationName)}</i>` : ''}
        `);
    });

    if (points.length > 1) {
      L.polyline(points, {
        color: '#0F766E',
        weight: 3,
        opacity: 0.7
      }).addTo(mapInstance);
    }

    mapInstance.fitBounds(L.latLngBounds(points), {
      padding: [30, 30]
    });
  }

  document.getElementById('export-map')?.addEventListener('click', async () => {
    try {
      toast('Generating image…');

      const canvas = await html2canvas(el, {
        useCORS: true
      });

      const link = document.createElement('a');

      link.download = `${trip.name.replace(/\s+/g, '_')}_map.png`;
      link.href = canvas.toDataURL();
      link.click();

      toast('Map exported');
    } catch (err) {
      toast('Export failed');
    }
  });
}

function showSheet(html) {

  root.innerHTML = `
    <div class="sheet-backdrop">

/* --------------------- ADD EXPENSE MODAL FORM --------------------------- */

function openAddExpense(prefill) {
  const trip = tripById(state.selectedTripId);

  if (!trip) return;

  const cats = state.categories.filter(c => c.isActive);
  const today = new Date().toISOString().slice(0, 10);
  const time = new Date().toTimeString().slice(0, 5);
  const defaultCur = trip.defaultCurrency || state.displayCurrency;
  const p = prefill || {};

  if (cats.length === 0) {
    showSheet(`
      <h2>No active categories</h2>

      <p class="small muted" style="margin-bottom:12px">
        You need at least one active category.
      </p>

      <button class="btn" id="goto-cats">
        Create a category
      </button>

      <button class="btn btn-ghost" id="cancel-empty" style="margin-top:6px">
        Cancel
      </button>
    `);

    document.getElementById('goto-cats').onclick = () => {
      closeSheet();
      go('categories');
    };

    document.getElementById('cancel-empty').onclick = closeSheet;

    return;
  }

  showSheet(`
    <h2>New expense</h2>

    <p class="small muted" style="margin-bottom:12px">
      Saving to: ${escapeHtml(trip.name)} — Actual
    </p>

    <form id="exp-form">
      <input type="hidden" name="lat" value="${p.lat || ''}">
      <input type="hidden" name="lng" value="${p.lng || ''}">
      <input type="hidden" name="locationName" value="${escapeHtml(p.locationName || '')}">

      <div class="row2">
        <div class="field">
          <label>Date</label>
          <input type="date" name="date" value="${p.date || today}" required>
        </div>

        <div class="field">
          <label>Time</label>
          <input type="time" name="time" value="${p.time || time}" required>
        </div>
      </div>

      <div class="field">
        <label style="display:flex; justify-content:space-between; align-items:center">
          <span>Category</span>
          <button type="button" class="btn-ghost" id="exp-new-cat" style="font-size:12px; padding:0">
            + New category
          </button>
        </label>

        <select name="categoryId" required>
          ${cats.map(c => `
            <option value="${c.id}" ${p.categoryId === c.id ? 'selected' : ''}>
              ${c.icon || '📌'} ${escapeHtml(c.name)}
            </option>
          `).join('')}
        </select>
      </div>

      <div class="field">
        <label>Description</label>
        <input name="description" value="${escapeHtml(p.description || '')}" placeholder="e.g. Lunch at Bryggen">
      </div>

      <div class="row3">
        <div class="field">
          <label>Amount</label>
          <input
            type="number"
            name="originalAmount"
            step="0.01"
            min="0"
            required
            placeholder="0.00"
            value="${p.originalAmount || ''}"
            autofocus
          >
        </div>

        <div class="field">
          <label>Currency</label>

          <select name="originalCurrency">
            ${SUPPORTED_CURRENCIES.map(c => `
              <option value="${c}" ${c === (p.originalCurrency || defaultCur) ? 'selected' : ''}>
                ${c}
              </option>
            `).join('')}
          </select>
        </div>
      </div>

      <div class="field">
        <label>Payment method</label>

        <select name="paymentMethod">
          ${['card', 'cash', 'bank', 'other'].map(m => `
            <option value="${m}" ${p.paymentMethod === m ? 'selected' : ''}>
              ${m.charAt(0).toUpperCase() + m.slice(1)}${m === 'bank' ? ' transfer' : ''}
            </option>
          `).join('')}
        </select>
      </div>

      <div class="field">
        <label>Location optional</label>

        <div class="btn-row">
          <button type="button" class="btn btn-secondary btn-sm" id="loc-btn" style="flex:1">
            📍 Capture location
          </button>

          <button type="button" class="btn btn-secondary btn-sm" id="loc-clear">
            Clear
          </button>
        </div>

        <div id="loc-status" class="tiny muted" style="margin-top:6px">
          ${p.lat ? `📍 ${p.lat}, ${p.lng}` : 'Permission required.'}
        </div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea name="notes" placeholder="Anything to remember">${escapeHtml(p.notes || '')}</textarea>
      </div>

      <button class="btn" type="submit" id="save-exp-btn">
        Save expense
      </button>

      <button type="button" class="btn btn-ghost" id="exp-cancel" style="margin-top:6px">
        Cancel
      </button>
    </form>
  `);

  const form = document.getElementById('exp-form');

  document.getElementById('exp-cancel').onclick = closeSheet;

  document.getElementById('exp-new-cat').onclick = () => {
    const currentData = Object.fromEntries(new FormData(form));

    closeSheet();

    openCatEdit(null, newCat => {
      openAddExpense({
        ...currentData,
        categoryId: newCat ? newCat.id : currentData.categoryId
      });
    });
  };

  document.getElementById('loc-btn').onclick = () => {
    if (!navigator.geolocation) {
      document.getElementById('loc-status').textContent = 'Geolocation not supported.';
      return;
    }

    document.getElementById('loc-status').textContent = 'Requesting location…';

    navigator.geolocation.getCurrentPosition(
      pos => {
        form.lat.value = pos.coords.latitude.toFixed(6);
        form.lng.value = pos.coords.longitude.toFixed(6);
        form.locationName.value = `Lat ${pos.coords.latitude.toFixed(3)}, Lng ${pos.coords.longitude.toFixed(3)}`;

        document.getElementById('loc-status').textContent = `📍 ${form.lat.value}, ${form.lng.value}`;
      },
      () => {
        document.getElementById('loc-status').textContent = 'Permission denied. You can still save.';
      }
    );
  };

  document.getElementById('loc-clear').onclick = () => {
    form.lat.value = '';
    form.lng.value = '';
    form.locationName.value = '';

    document.getElementById('loc-status').textContent = 'Cleared.';
  };

  form.onsubmit = async e => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form));

    data.tripId = state.selectedTripId;
    data.originalAmount = parseFloat(data.originalAmount);

    if (!data.lat) delete data.lat;
    if (!data.lng) delete data.lng;

    const btn = document.getElementById('save-exp-btn');

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await gsRun('saveExpense', data);

      await loadTripData(state.selectedTripId, true);

      closeSheet();
      render();
      toast('Expense saved');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Save expense';
      toast('Save failed: ' + err.message);
    }
  };
}

/* ----------------------- CATEGORY EDIT MODAL ---------------------------- */

function openCatEdit(id, onDoneCallback) {
  const c = id
    ? catById(id)
    : {
      name: '',
      type: 'Daily',
      icon: '📌',
      color: '#0F766E',
      isActive: true
    };

  showSheet(`
    <h2>${id ? 'Edit category' : 'New category'}</h2>

    <form id="cat-form">
      <div class="field">
        <label>Name</label>
        <input name="name" value="${escapeHtml(c.name)}" required autofocus>
      </div>

      <div class="field">
        <label>Type</label>

        <select name="type">
          ${['Travel', 'Daily', 'Accommodation', 'Miscellaneous'].map(t => `
            <option ${c.type === t ? 'selected' : ''}>${t}</option>
          `).join('')}
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label>Icon emoji</label>
          <input name="icon" value="${escapeHtml(c.icon)}" maxlength="2">
        </div>

        <div class="field">
          <label>Color</label>
          <input type="color" name="color" value="${c.color}">
        </div>
      </div>

      <button type="submit" class="btn" id="save-cat-btn">
        ${id ? 'Save' : 'Create'}
      </button>

      ${id ? `
        <button type="button" class="btn btn-danger" id="cat-del" style="margin-top:8px">
          Delete permanently
        </button>
      ` : ''}

      <button type="button" class="btn btn-ghost" id="cat-cancel" style="margin-top:6px">
        Cancel
      </button>
    </form>
  `);

  document.getElementById('cat-cancel').onclick = () => {
    closeSheet();

    if (onDoneCallback) {
      onDoneCallback(null);
    }
  };

  document.getElementById('cat-form').onsubmit = async e => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(e.target));
    const btn = document.getElementById('save-cat-btn');

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      let result;

      if (id) {
        await gsRun('updateCategory', id, data);

        const cat = catById(id);

        Object.assign(cat, data);

        result = cat;
      } else {
        result = await gsRun('createCategory', data);

        state.categories.push(result);
      }

      closeSheet();

      if (onDoneCallback) {
        onDoneCallback(result);
      } else {
        render();
      }

      toast(id ? 'Category updated' : 'Category created');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = id ? 'Save' : 'Create';
      toast('Failed: ' + err.message);
    }
  };

  if (id) {
    document.getElementById('cat-del').onclick = async () => {
      try {
        const r = await gsRun('deleteCategory', id);

        if (!r.ok) {
          alert('This category is used by existing predictions or expenses. Deactivate it instead.');
          return;
        }

        state.categories = state.categories.filter(c => c.id !== id);

        closeSheet();
        render();
        toast('Category deleted');
      } catch (err) {
        toast('Delete failed: ' + err.message);
      }
    };
  }
}

/* ------------------------- EVENT HANDLERS ------------------------------- */

function attachContentHandlers() {
  document.querySelectorAll('[data-trip]').forEach(el => {
    el.onclick = async () => {
      setSelectedTripId(el.dataset.trip);

      await loadTripData(state.selectedTripId, true);

      go('dashboard');
    };
  });

  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = async ev => {
      ev.preventDefault();

      const a = el.dataset.action;

      if (a === 'newtrip') {
        go('createTrip');
      }

      if (a === 'goto-home') {
        go('home');
      }

      if (a === 'goto') {
        if (['prediction', 'actual', 'map', 'dashboard'].includes(el.dataset.screen) && !state.selectedTripId) {
          toast('Select a trip first');
          return;
        }

        go(el.dataset.screen);
      }

      if (a === 'select-trip') {
        setSelectedTripId(el.dataset.id);

        await loadTripData(state.selectedTripId, true);

        go('dashboard');
      }

      if (a === 'edit-trip') {
        state.editingTripId = el.dataset.id;

        go('editTrip');
      }

      if (a === 'delete-trip') {
        if (confirm('Permanently delete this trip and its spreadsheet?')) {
          try {
            await gsRun('deleteTrip', state.editingTripId);

            state.trips = state.trips.filter(t => t.id !== state.editingTripId);

            delete state.expensesByTrip[state.editingTripId];
            delete state.predictionsByTrip[state.editingTripId];

            if (state.selectedTripId === state.editingTripId) {
              setSelectedTripId(null);
            }

            toast('Trip deleted');
            go('home');
          } catch (err) {
            toast('Delete failed: ' + err.message);
          }
        }
      }

      if (a === 'add-expense') {
        openAddExpense();
      }

      if (a === 'new-cat') {
        openCatEdit(null);
      }

      if (a === 'new-cat-from-pred') {
        openCatEdit(null);
      }

      if (a === 'edit-cat') {
        openCatEdit(el.dataset.id);
      }

      if (a === 'toggle-cat') {
        const c = catById(el.dataset.id);
        const newActive = !c.isActive;

        try {
          await gsRun('updateCategory', c.id, {
            isActive: newActive
          });

          c.isActive = newActive;

          toast(newActive ? 'Reactivated' : 'Deactivated');

          render();
        } catch (err) {
          toast('Failed: ' + err.message);
        }
      }
    };
  });

  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => {
      state.dashTab = b.dataset.tab;
      render();
    };
  });

  const tForm = document.getElementById('trip-form');

  if (tForm) {
    tForm.onsubmit = async e => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(tForm));

      if (state.trips.some(t => t.name.toLowerCase() === data.name.toLowerCase())) {
        toast('Trip name already exists');
        return;
      }

      if (new Date(data.endDate) < new Date(data.startDate)) {
        toast('End date must be on or after start date');
        return;
      }

      const btn = document.getElementById('create-btn');

      btn.disabled = true;
      btn.textContent = 'Creating spreadsheet…';

      try {
        const t = await gsRun('createTrip', data);

        state.trips.push(t);
        setSelectedTripId(t.id);
        state.expensesByTrip[t.id] = [];
        state.predictionsByTrip[t.id] = [];

        toast('Trip & spreadsheet created');

        go('prediction');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Create trip & spreadsheet';
        toast('Create failed: ' + err.message);
      }
    };
  }

  const eForm = document.getElementById('trip-edit-form');

  if (eForm) {
    eForm.onsubmit = async e => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(eForm));

      if (new Date(data.endDate) < new Date(data.startDate)) {
        toast('End date must be on or after start date');
        return;
      }

      const btn = document.getElementById('save-trip-btn');

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        await gsRun('updateTrip', state.editingTripId, data);

        const t = tripById(state.editingTripId);

        Object.assign(t, data);

        toast('Trip updated');

        go('home');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Save changes';
        toast('Save failed: ' + err.message);
      }
    };
  }

  const pForm = document.getElementById('pred-form');

  if (pForm) {
    pForm.onsubmit = async e => {
      e.preventDefault();

      const fd = new FormData(pForm);
      const dc = state.displayCurrency;
      const btn = document.getElementById('save-pred-btn');

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        let saved = 0;
        const tripId = state.selectedTripId;
        const updates = [];
        const deletions = [];

        state.categories.filter(c => c.isActive).forEach(c => {
          const v = fd.get('cat_' + c.id);
          const num = parseFloat(v);

          if (!isNaN(num) && num > 0) {
            const eurAmount = dc === 'EUR'
              ? num
              : num / (state.rates[dc] || 1);

            updates.push({
              tripId,
              categoryId: c.id,
              estimatedEur: eurAmount,
              notes: ''
            });
          } else {
            const ex = predictionsForTrip(tripId).find(p => p.categoryId === c.id);

            if (ex) {
              deletions.push({
                tripId,
                categoryId: c.id
              });
            }
          }
        });

        for (const u of updates) {
          await gsRun('upsertPrediction', u);
          saved++;
        }

        for (const d of deletions) {
          await gsRun('deletePrediction', d);
        }

        await loadTripData(tripId, true);

        toast(`Prediction saved (${saved} categories)`);

        state.dashTab = 'compare';

        go('dashboard');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Save prediction';
        toast('Save failed: ' + err.message);
      }
    };
  }

  const rForm = document.getElementById('rates-form');

  if (rForm) {
    rForm.onsubmit = async e => {
      e.preventDefault();

      const fd = new FormData(rForm);
      const newRates = { EUR: 1 };

      SUPPORTED_CURRENCIES.filter(c => c !== 'EUR').forEach(c => {
        const v = parseFloat(fd.get(c));

        if (!isNaN(v) && v > 0) {
          newRates[c] = v;
        }
      });

      try {
        const r = await gsRun('setManualRates', {
          rates: newRates
        });

        state.rates = { ...FALLBACK_RATES, ...r.rates };
        state.ratesUpdated = r.updated || new Date().toISOString();
        state.ratesSource = 'Manual';
        state.ratesStatus = 'manual';

        writeRatesCache({
          rates: state.rates,
          fetchedAt: state.ratesUpdated,
          source: state.ratesSource
        });

        toast('Manual rates saved');

        render();
      } catch (err) {
        toast('Save failed: ' + err.message);
      }
    };
  }

  const refresh2 = document.getElementById('refresh-rates-2');

  if (refresh2) {
    refresh2.onclick = async () => {
      refresh2.disabled = true;
      refresh2.textContent = 'Refreshing…';

      try {
        const live = await gsRun('fetchAndStoreRates');

        if (live && live.ok) {
          state.rates = { ...FALLBACK_RATES, ...live.rates };
          state.ratesUpdated = live.updated || new Date().toISOString();
          state.ratesSource = live.source || 'Open ER API';
          state.ratesStatus = 'live';

          writeRatesCache({
            rates: state.rates,
            fetchedAt: state.ratesUpdated,
            source: state.ratesSource
          });

          toast('Live rates loaded');
        } else {
          toast('Could not reach rate server');
        }
      } catch {
        toast('Refresh failed');
      }

      render();
    };
  }

  document.querySelectorAll('[data-expense]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.expense;
      const e = expensesForTrip(state.selectedTripId).find(x => x.id === id);

      if (!e) return;

      const c = catById(e.categoryId);
      const altCurrencies = ['EUR', 'AED', 'INR', 'USD', 'GBP']
        .filter(cc => cc !== state.displayCurrency)
        .slice(0, 3);

      showSheet(`
        <h2>${escapeHtml(e.description || c?.name || 'Expense')}</h2>

        <p class="small muted">
          ${fmtFullDate(e.date)} · ${escapeHtml(c?.name || e.categoryName || '')}
        </p>

        <div class="card-tight" style="background:var(--bg); margin:12px 0">
          <div>
            <b>${fmtDisplay(e.amountEur)}</b> ${state.displayCurrency}
          </div>

          <div class="small muted">
            ${altCurrencies.map(cc => fmtMoney(convert(e.amountEur, cc), cc)).join(' · ')}
          </div>

          <div class="small muted" style="margin-top:6px">
            Original: ${fmtMoney(e.originalAmount, e.originalCurrency)}
          </div>

          ${e.locationName ? `
            <div class="small" style="margin-top:6px">
              📍 ${escapeHtml(e.locationName)}
            </div>
          ` : ''}

          ${e.notes ? `
            <div class="small" style="margin-top:6px">
              ${escapeHtml(e.notes)}
            </div>
          ` : ''}
        </div>

        <button class="btn btn-danger" id="del-exp">
          Delete expense
        </button>

        <button class="btn btn-ghost" id="close-exp" style="margin-top:8px">
          Close
        </button>
      `);

      document.getElementById('del-exp').onclick = async () => {
        if (!confirm('Delete this expense?')) return;

        try {
          await gsRun('deleteExpense', {
            tripId: state.selectedTripId,
            expenseId: id
          });

          await loadTripData(state.selectedTripId, true);

          closeSheet();
          render();
          toast('Expense deleted');
        } catch (err) {
          toast('Delete failed: ' + err.message);
        }
      };

      document.getElementById('close-exp').onclick = closeSheet;
    };
  });
}

/* ------------------------------ INIT ------------------------------------ */

boot();
</script>
